name: asieris
description: Asieris Pharmaceuticals is a China-based biopharmaceutical company developing innovative
  therapies in genitourinary tumors and women's health. Its focus areas span urologic oncology (bladder
  cancer diagnosis and treatment), women's health, and breast and gynecologic oncology, with marquee
  assets Vesique (APL-1202) for bladder cancer and Cevira (APL-1702), a non-invasive photodynamic therapy
  for cervical precancerous lesions. The company runs three proprietary R&D platforms (TIMN, TAIDD, DDC).
  It was surfaced as a portfolio company of Qiming and added to the API Evangelist network; as a
  biopharma company it publishes no public developer API surface.
